services:
  - type: web
    name: care-compass-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.3
      # The full PolicyEngine model exceeds the memory budget of the web API
      # service. Keep the lightweight 50-state catalog available here; use a
      # dedicated larger worker before enabling household calculations.
      - key: POLICYENGINE_CALCULATION_ENABLED
        value: "false"
